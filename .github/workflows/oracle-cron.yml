name: 'Oracle Auto Cron Match'

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  oracle-stack-apply:
    name: 'Run OCI Stack Apply'
    runs-on: ubuntu-latest

    steps:
    - name: 'Set up Python'
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 'Install OCI CLI via Pip'
      run: |
        python -m pip install --upgrade pip
        pip install oci-cli

    - name: 'Configure OCI Config'
      env:
        OCI_USER: ${{ secrets.OCI_USER_OCID }}
        OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
        OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.oci
        echo "$OCI_KEY" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem
        
        echo "[DEFAULT]" > ~/.oci/config
        echo "user=$OCI_USER" >> ~/.oci/config
        echo "fingerprint=$OCI_FINGERPRINT" >> ~/.oci/config
        echo "tenancy=$OCI_TENANCY" >> ~/.oci/config
        echo "region=ap-tokyo-1" >> ~/.oci/config
        echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
        chmod 600 ~/.oci/config

    - name: 'Trigger OCI Stack Apply'
      run: |
        oci resource-manager job create-apply-job --stack-id "${{ secrets.OCI_STACK_OCID }}" --execution-plan-strategy "AUTO_APPROVED"

    - name: 'Loop Self Trigger'
      if: always()
      run: |
        sleep 1800
        curl -X POST -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
        -H "Accept: application/vnd.github.v3+json" \
        https://github.com{{ github.repository }}/actions/workflows/oracle-cron.yml/dispatches \
        -d '{"ref":"main"}'
