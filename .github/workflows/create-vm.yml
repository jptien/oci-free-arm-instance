name: 'Try to Create OCI VM'

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  oracle-stack-apply:
    name: 'Run OCI Stack Apply'
    runs-on: ubuntu-latest

    steps:
    - name: 'Configure OCI CLI'
      uses: oracle-actions/setup-oci-cli@v1.3.2
      with:
        user: ${{ secrets.OCI_USER_OCID }}
        tenancy: ${{ secrets.OCI_TENANCY_OCID }}
        fingerprint: ${{ secrets.OCI_FINGERPRINT }}
        region: ap-tokyo-1
        private_key: ${{ secrets.OCI_PRIVATE_KEY }}

    - name: 'Trigger OCI Stack Apply'
      run: |
        oci resource-manager job create-apply-job --stack-id "${{ secrets.OCI_STACK_OCID }}" --execution-plan-strategy "FROM_PLAN_OUTPUT" --wait-for-state "SUCCEEDED" --wait-for-state "FAILED"
